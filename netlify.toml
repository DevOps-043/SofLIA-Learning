[build]
  # Directorio base del monorepo
  base = "."
  
  # Comando usando script bash que maneja NODE_ENV correctamente
  # El script asegura que devDependencies (TypeScript) se instalen correctamente
  command = "bash scripts/netlify-build.sh"
  
  # Directorio de publicación (Next.js con Netlify plugin maneja esto automáticamente)
  publish = "apps/web/.next"

[build.environment]
  # Versión de Node.js (lee automáticamente desde .nvmrc)
  # Actualizado a Node.js 22 para compatibilidad con camera-controls@3.1.2 que requiere Node >= 22.0.0
  NODE_VERSION = "22"
  
  # Habilitar plugin de Next.js
  NETLIFY_NEXT_PLUGIN_SKIP = "false"

  # Runtime path for the bundled FFmpeg binary inside the BG function.
  # ffprobe is NOT bundled — the BG function reads dimensions by parsing
  # `ffmpeg -i` stderr, which keeps the function bundle under 250 MB.
  # Enable VIDEO_TRANSCODING_ENABLED=true in the Netlify UI only after the
  # binary is downloaded by scripts/netlify-build.sh.
  FFMPEG_PATH = "/var/task/apps/web/bin/ffmpeg"

# Configuración para Next.js con serverless functions
# Este plugin maneja automáticamente el build y deployment de Next.js
[[plugins]]
  package = "@netlify/plugin-nextjs"
  # Nota: Si el error persiste, puede ser necesario esperar una actualización del plugin
  # o contactar al soporte de Netlify ya que es un error HTTP 500 del lado del servidor

# Redirecciones automáticas para Next.js (el plugin las maneja)
# Solo necesitamos mantener esto para rutas específicas si es necesario

# Headers de seguridad
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    Content-Security-Policy = 'default-src "self"; script-src "self" "unsafe-inline" "unsafe-eval" https://cdn.jsdelivr.net https://www.youtube.com https://challenges.cloudflare.com https://js.hcaptcha.com; style-src "self" "unsafe-inline" https://fonts.googleapis.com; font-src "self" https://fonts.gstatic.com; img-src "self" data: https:; connect-src "self" https://*.supabase.co wss://*.supabase.co https://api.openai.com https://challenges.cloudflare.com https://hcaptcha.com https://*.hcaptcha.com; frame-src "self" https://www.youtube.com https://challenges.cloudflare.com https://hcaptcha.com https://*.hcaptcha.com;'

# Cache para assets estáticos
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/public/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Configuración de funciones para Next.js
# El plugin de Next.js convierte automáticamente las API routes en Netlify Functions
# No necesitas un Functions directory separado para Next.js API routes
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, s-maxage=3600, stale-while-revalidate=300"

[[headers]]
  for = "/business"
  [headers.values]
    Cache-Control = "public, s-maxage=3600, stale-while-revalidate=300"

[[headers]]
  for = "/downloads"
  [headers.values]
    Cache-Control = "public, s-maxage=600, stale-while-revalidate=60"

[[headers]]
  for = "/courses/*"
  [headers.values]
    Cache-Control = "public, s-maxage=300, stale-while-revalidate=60"

[[headers]]
  for = "/news/*"
  [headers.values]
    Cache-Control = "public, s-maxage=600, stale-while-revalidate=60"

[functions]
  # Directorio para funciones tradicionales de Netlify (opcional)
  directory = "netlify/functions"
  node_bundler = "esbuild"
  # FFmpeg binaries (apps/web/bin/) NO se incluyen aquí.
  # El SSR handler tiene un límite de 250 MB y los binarios de FFmpeg son ~160 MB;
  # incluirlos hace que el bundle supere el límite. El transcoding adaptativo
  # requiere una función separada o un servicio externo cuando se active en producción.
  included_files = []
  # Paquetes excluidos del bundle de esbuild de Netlify Functions.
  # Para el SSR handler (___netlify-server-handler) el tamaño se controla
  # desde next.config.js → outputFileTracingExcludes.
  external_node_modules = [
    "sharp", "canvas", "html2canvas", "jspdf",
    "exceljs", "pdfmake", "openai", "nodemailer",
    "xml2js", "jszip", "node-vibrant", "bcryptjs"
  ]

# Background function: async HLS transcoding via FFmpeg.
# Only ffmpeg is bundled (~80 MB) — ffprobe was dropped because
# bundling both pushed the function past the 250 MB cap.  Dimensions
# are read by parsing `ffmpeg -i` stderr inside the function.
# external_node_modules is overridden to an empty list to avoid pulling
# the 12 packages declared in the global [functions] block (~80-100 MB)
# into this specific function's bundle.
# Runtime path matches FFMPEG_PATH set in [build.environment].
[functions."transcode-video-background"]
  included_files = ["apps/web/bin/ffmpeg"]
  external_node_modules = []

# Función programada: Procesar lecciones inactivas cada 5 minutos
[functions."process-inactive-lessons"]
  schedule = "*/5 * * * *"

# Función programada: Procesar cursos del inbox de CourseEngine cada 5 minutos
[functions."process-inbox"]
  schedule = "*/5 * * * *"

# Funcion programada: Procesar apuntes SofLIA por modulo cada 5 minutos
[functions."process-module-learning-summaries"]
  schedule = "*/5 * * * *"

[functions."process-tts-audio"]
  schedule = "*/5 * * * *"


# Configuración específica para diferentes contextos (opcional)
# Si no se especifica, se usa el comando de [build]
[context.production]
  command = "bash scripts/netlify-build.sh"

[context.branch-deploys]
  command = "bash scripts/netlify-build.sh"

[context.deploy-preview]
  command = "bash scripts/netlify-build.sh"
