name: Web Critical Quality

on:
  pull_request:
    paths:
      - 'apps/web/src/lib/api/**'
      - 'apps/web/src/app/api/auth/**'
      - 'apps/web/src/lib/security/**'
      - 'apps/web/tests/e2e/**'
      - 'supabase/migrations/**'
      - 'apps/web/package.json'
      - 'package-lock.json'
      - '.github/workflows/web-critical-quality.yml'
  push:
    branches:
      - main
    paths:
      - 'apps/web/src/lib/api/**'
      - 'apps/web/src/app/api/auth/**'
      - 'apps/web/src/lib/security/**'
      - 'apps/web/tests/e2e/**'
      - 'supabase/migrations/**'
      - 'apps/web/package.json'
      - 'package-lock.json'
      - '.github/workflows/web-critical-quality.yml'

jobs:
  critical-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: API route validation guard (Tarea 1.4 anti-regresion)
        env:
          CI_STRICT_TECH_DEBT: 'true'
        run: npm run audit:route-validation

      - name: API pagination guard
        env:
          CI_STRICT_TECH_DEBT: 'true'
        run: npm run audit:pagination

      - name: Critical coverage guard
        run: npm run test:coverage:critical --workspace=apps/web

      - name: Critical lint guard
        working-directory: apps/web
        env:
          CI_STRICT_TECH_DEBT: 'true'
        run: >
          npx eslint
          src/lib/api/errors.ts
          src/lib/api/with-validation.ts
          src/lib/api/with-auth.ts
          src/app/api/auth/dashboard-destination/route.ts
          src/app/api/auth/refresh/route.get.ts
          src/app/api/auth/refresh/route.post.ts
          src/lib/security/__tests__/rls-migrations.test.ts
          --quiet

      - name: Install Playwright browser
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Security fine E2E guard
        working-directory: apps/web
        env:
          WEB_ALLOWED_ORIGINS: https://app.soflia.example
        run: npx playwright test tests/e2e/tenant-isolation.spec.ts
