version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: America/Mexico_City
    open-pull-requests-limit: 8
    versioning-strategy: increase-if-necessary
    groups:
      npm-patch-minor:
        update-types:
          - patch
          - minor

  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
      day: monday
      time: "08:30"
      timezone: America/Mexico_City
    open-pull-requests-limit: 8
    versioning-strategy: increase-if-necessary
    groups:
      web-patch-minor:
        update-types:
          - patch
          - minor

  - package-ecosystem: npm
    directory: /apps/api
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Mexico_City
    open-pull-requests-limit: 5
    versioning-strategy: increase-if-necessary
    groups:
      api-patch-minor:
        update-types:
          - patch
          - minor
